name: newsroom-capstone
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: newsroom
      MARIADB_USER: newsroom_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - newsroom_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  web:
    build: .
    image: newsroom-consolidation:1.0
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      DB_ENGINE: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: newsroom
      DB_USER: newsroom_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      APPROVAL_API_URL: http://127.0.0.1:8000/api/approved/
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
volumes:
  newsroom_database:
