name: Verify Django Docker and documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable CI credentials
        shell: bash
        run: |
          for name in DJANGO_SECRET_KEY DB_PASSWORD DB_ROOT_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build and start Django with MariaDB
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Check Django and migrations
        run: |
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py makemigrations --check --dry-run
          docker compose exec -T web python manage.py showmigrations
      - name: Allow the app account to create its temporary test database
        run: >-
          docker compose exec -T db mariadb -uroot "-p$DB_ROOT_PASSWORD"
          -e "GRANT ALL PRIVILEGES ON test_newsroom.* TO 'newsroom_app'@'%';"
      - name: Run capstone regression tests against MariaDB
        run: docker compose exec -T web python manage.py test --noinput
      - name: Test actual browser and API workflows over HTTP
        run: docker compose exec -T web python manage.py shell < scripts/container_smoke.py
      - name: Verify running containers
        run: |
          docker compose ps
          docker compose exec -T web id
      - name: Collect diagnostics
        if: always()
        run: docker compose logs --no-color
      - name: Shut down disposable test stack
        if: always()
        run: docker compose down
